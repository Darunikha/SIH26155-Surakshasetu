version: "3.7"

networks:
  securityaudit:
    name: securityaudit_network

volumes:
  orderer_data:
  peer0_data:

services:
  orderer.securityaudit.com:
    container_name: orderer.securityaudit.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/channel-artifacts/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/ca.crt]
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
    working_dir: /root
    command: orderer
    volumes:
      - ./channel-artifacts:/channel-artifacts
      - ./crypto-config:/crypto-config
      - orderer_data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "8443:8443"
    networks:
      - securityaudit

  peer0.org1.securityaudit.com:
    container_name: peer0.org1.securityaudit.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securityaudit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.securityaudit.com
      - CORE_PEER_ADDRESS=peer0.org1.securityaudit.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.securityaudit.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.securityaudit.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.securityaudit.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/msp
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/crypto-config
      - peer0_data:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    depends_on:
      - orderer.securityaudit.com
    networks:
      - securityaudit

  cli:
    container_name: cli.securityaudit.com
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securityaudit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.securityaudit.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/crypto-config/peerOrganizations/org1.securityaudit.com/peers/peer0.org1.securityaudit.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/crypto-config/peerOrganizations/org1.securityaudit.com/users/Admin@org1.securityaudit.com/msp
      - ORDERER_CA=/crypto-config/ordererOrganizations/securityaudit.com/orderers/orderer.securityaudit.com/tls/ca.crt
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./channel-artifacts:/channel-artifacts
      - ./crypto-config:/crypto-config
      - ../chaincode/security-audit-chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    depends_on:
      - orderer.securityaudit.com
      - peer0.org1.securityaudit.com
    networks:
      - securityaudit
