! Synthetic Cisco IOS-XE configuration for demo/testing purposes only.
! Contains intentional security weaknesses for compliance-engine validation.
version 17.3
hostname Cisco-RTR-01
!
enable password cisco123
!
username admin password cisco
!
aaa new-model
!
no ip domain lookup
ip domain name lab.local
!
ip ssh version 1
!
interface GigabitEthernet0/0
 description Connection to Internet WAN
 ip address 203.0.113.5 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description Inside-LAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
zone security untrust
zone security trust
!
ip http server
ip http secure-server
!
access-list 101 permit ip any any
!
ip access-list extended INBOUND
 permit tcp any any eq 22
 permit ip any any
!
snmp-server community public RO
!
line con 0
 exec-timeout 0 0
line vty 0 4
 transport input telnet ssh
 exec-timeout 0 0
!
security-admin-session-timeout 900
!
end
