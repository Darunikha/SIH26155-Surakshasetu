#config-version=FGT60E-7.0.1-FW-build0157-220401:opmode=0:vdom=0
#conf_file_ver=1
config system global
    set hostname "FortiGate-01"
    set admin-ssh-v1 disable
    set ssh-version 2
end
config system interface
    edit "wan1"
        set ip 198.51.100.10 255.255.255.0
        set allowaccess ping https ssh http telnet
        set role wan
        set status up
    next
    edit "internal"
        set ip 10.1.1.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set status up
    next
end
config system password-policy
    set status enable
    set minimum-length 8
end
config log syslogd setting
    set status disable
end
config system ntp
    set ntpsync disable
end
config system snmp community
    edit 1
        set name "public"
    next
end
config system zone
    edit "untrust-zone"
    next
    edit "trust-zone"
    next
end
config firewall policy
    edit 1
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
end
